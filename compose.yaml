services:
  clarp:
    image: ${CLARP_IMAGE:-ghcr.io/maxteabag/clarp:stable}
    build:
      context: .
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${CLARP_LISTEN_ADDR:-0.0.0.0}:${CLARP_PORT:-7682}:7682"
    volumes:
      - clarp-data:/data
    environment:
      CLARP_SERVER_NAME: ${CLARP_SERVER_NAME:-Clarp Docker}
      CLARP_PORT: ${CLARP_PORT:-7682}
      CLARP_PUBLIC_URL: ${CLARP_PUBLIC_URL:-}
      CLARP_COMPOSE_PROJECT: ${CLARP_COMPOSE_PROJECT:-}
      CLARP_COMPOSE_DIRECTORY: ${CLARP_COMPOSE_DIRECTORY:-}
      CLARP_COMPOSE_FILES: ${CLARP_COMPOSE_FILES:-compose.yaml}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=512m,mode=1777
    stop_grace_period: 45s

volumes:
  clarp-data:

    "_normalize_altitude", "_skip_busy_reason", "_recover_stale_sent_round", "_env_int", "_routine_self_activity_busy",
    "_resolve_dream_llm", "_assistant_text_from_result", "_dose_snapshot", "_with_isolated_context_snapshot", "_recent_real_context_snapshot",
    "_insert_round", "_ensure_next_rounds", "_rounds", "_threads", "_stage_exists",
    "_incomplete_stages", "_next_round_index", "_create_threads_from_seed", "_create_fanout_rounds", "_create_iteration_rounds",
    "_sync_run_progress",

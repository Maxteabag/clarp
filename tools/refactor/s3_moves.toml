# S3 group moves (docs/architecture/route-registry.md, section 11).
# Each [[group]] moves the listed Handler members out of server/server.py into
# server/<module> as class <class>, applied by tools/refactor/s3_apply.py in this
# order. A new or changed entry needs reviewer G3; re-applications need only the
# automated gates.

# Module-level helpers of server.py read by moved members; moved first, imported back.
[helpers]
names = [
    "_runtime_paths",
    "_truthy_header",
]

[[group]]
name = "vocab"

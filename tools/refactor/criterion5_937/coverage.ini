# Exact measurement-only profile; no change to product/test environment allowlists.
[run]
branch = True
parallel = False
relative_files = True
source = server
dynamic_context = test_function

[report]
# Explicit denominator is every supported Python file under the selected pin's
# server tree, imported or not. Default pragma exclusions are recorded by the
# frozen coverage7.17 tool and remain visible in the emitted JSON.
skip_empty = False
skip_covered = False
show_missing = True

# claude-pwa configuration.
# Copied to ~/.config/clarp/config.toml by install.sh on first install.
# All keys are optional — anything you leave out uses the defaults shown here.

[server]
# Network interface to bind. Default loopback is safe for a fresh install.
# To expose the app, prefer `tailscale serve`; direct Tailnet binding is also
# supported when deliberately configured.
bind_addr = "127.0.0.1"
port      = 7682

# Bearer-token auth. Empty = no auth check (trust the network).
# Set to a long random string (e.g. `python -c "import secrets; print(secrets.token_urlsafe(32))"`)
# to require `Authorization: Bearer <token>` (or `?token=<token>` on URLs that
# can't carry headers, like iOS Shortcuts) on every endpoint.
auth_token = ""

# App session the client picks when no session has been selected yet.
default_session = "claude"

# Optional environment inherited by the Clarp server, runtime, and agent turns.
# This is useful when credentials are exposed through a desktop SSH agent
# rather than key files. `~` expands to this user's home directory. Clarp's own
# runtime variables remain authoritative and cannot be overridden here.
#
# [env]
# SSH_AUTH_SOCK = "~/.bitwarden-ssh-agent.sock"

[tts]
# cartesia | elevenlabs | deepgram | kokoro | piper | iphone | none
provider = "cartesia"
# Explicit fallback only. Use none to avoid moving work to another paid API.
fallback = "none"

# Per-agent voice provider, keyed by agent name or session
# (docs/tts-agent-provider.md):
# [tts.agents.Ingrid]
# provider = "gemini"
# gemini_voice = "Charon"        # <provider>_voice picks that provider's voice

[gemini_tts]
# API key. If empty, falls back to GEMINI_API_KEY.
api_key = ""
model = "gemini-3.8-flash-tts"
# Prebuilt voice name, or a Voice Design id ("voice_..."). Default voice.
voice = "Kore"
# Per-contact Gemini voices; the contact's other provider voices are kept.
# [gemini_tts.voices]
# Arnold = "voice_..."
# backend = "vertex" speaks through Vertex AI (no fixed daily request cap)
# with a Vertex express key. Designed voices exist per API surface, so Vertex
# uses the same contact's id from [gemini_tts.vertex_voices].
# backend = "gemini_api"
# vertex_api_key = ""            # or GOOGLE_VERTEX_API_KEY
# [gemini_tts.vertex_voices]
# Arnold = "voice_<uuid>"


[cartesia]
# API key. If empty, falls back to CARTESIA_API_KEY.
api_key = ""
model = "sonic-3.5"

[typesafe]
# Optional. Typed judgments (TypeSafe Jev) for decisions Clarp otherwise
# makes with regexes: junk transcripts, spoken-name routing, turn errors.
# Empty means every site keeps using its existing deterministic code.
# Falls back to TYPESAFE_API_KEY. Enable sites via /judgments/settings.
api_key = ""

[deepgram]
# API key. If empty, falls back to DEEPGRAM_API_KEY.
api_key = ""
model = "flux-haley-en"

[openai]
# Used by the optional Oracle Mode Realtime proxy and paid Contact portrait
# generation. The permanent key remains on this Computer and is never returned
# to the iPhone. If empty, in-process features fall back to OPENAI_API_KEY;
# detached Contact avatar workers read this file directly (see [contacts]).
api_key = ""
realtime_model = "gpt-realtime-2.1"
realtime_voice = "cedar"

[contacts]
# Paid Contact portraits (OpenAI gpt-image-2) for custom and auto-minted
# Contacts created without an avatar. Set avatar_generation to false, 0,
# "false", "off", "no" or "0" (or CLARP_CONTACT_AVATAR_GENERATION=0) to turn
# it off; any unreadable value also fails closed to off. Detached systemd
# worker units never receive OPENAI_API_KEY on their command line: if the key
# lives only in the Host service's environment and not in [openai] api_key
# above, the worker never gets it and fails unpaid 3 times per Contact, each
# try counting toward the daily 20.
# avatar_generation = true
# avatar_daily_limit = 20
# avatar_max_attempts = 3

[oracle]
# Languages you speak, as BCP-47 codes (docs/oracle-gemini-live.md). Gemini
# Live biases its transcription of your speech toward them, and Oracle is told
# them as a fact on either voice model. Empty: automatic language detection.
# languages = ["nb-NO", "en-US"]

[controller_actions]
# Custom actions a Flic or Watch gesture can run (`clarp-admin controller-action`).
# An http_post action may call loopback services on this machine; list any
# other URL prefix it may call here.
# allowed_urls = ["https://example.com/hooks/"]

[hotseat]
# The Hotseat desk in the apps: every saved Claude and Codex account with its
# quota, "Use" to switch the default account, "Continue" for work a usage limit
# stopped, and live reads of the providers. Set this to false to turn all of
# it off: the Host stops advertising the desk and answers 404 on /hotseat/desk,
# /hotseat/switch and /hotseat/resume, so the apps fall back to the read-only
# account view (/hotseat/status), which stays. The Hotseat switcher Janitor is
# not affected. The file is re-read while the Host runs; no restart is needed.
# desk = true

[network]
# Phone connectivity is explicit. "tailscale" uses HTTPS Serve, "lan" uses
# Bonjour discovery, "manual" records an existing HTTPS proxy, and "off" is
# local-only. Configure with `clarp-admin network use ...` or `clarp-tui`.
mode = "off"
advertise_lan = false

[elevenlabs]
# API key. If empty, falls back to the ELEVEN_API_KEY environment variable.
api_key = ""
# Model + speed for TTS synthesis. eleven_flash_v2_5 is the lowest-latency model.
model   = "eleven_flash_v2_5"
speed   = 1.2

[local_tts]
# Provider-specific voice. Empty selects Clarp's provider default.
voice = ""

[whisper]
# Local transcription provider and model for /transcribe. Setup selects
# faster-whisper on Linux and whisper.cpp on macOS.
# Manage installed models with `clarp-admin transcription ...`. Model weights
# are stored in provider caches and are never bundled in a Clarp release.
enabled = true
provider = "faster-whisper"
model   = "small.en"
compute = "int8"

[agents]
# Optional LLM overrides for turns dispatched through the app. Leave empty to
# use each CLI's own default. These trade quality for lower time-to-first-word
# on hands-free voice turns — the agent starts talking sooner.
#   claude_model           e.g. a faster Claude model passed as `claude --model`
#   codex_model            passed as `codex exec --model`
#   codex_reasoning_effort "low" | "medium" | "high" — "low" is the biggest
#                          latency win for Codex (less thinking before output)
#   agy_model              passed as `agy --model` (flag name unverified — test first)
# These are the DEFAULTS; each agent can override its own model/effort (set at
# create time, on relaunch, or live while running) — the per-agent value wins.
# Claude CLI provider:
#   "claude" = official Claude Code CLI (default)
#   "clarp"  = clarp wrapper
# Env override: CLAUDE_PWA_CLAUDE_CLI=claude|clarp
claude_cli             = "claude"
# Optional trusted local argv. See docs/claude-account-failover.md. Empty = off.
claude_account_switch_command = []
# Sessions explicitly designated to answer decision cards on the owner's
# behalf (for example a front-desk agent). Empty = nobody may. The acting
# session must also present its verified turn identity when it answers.
decision_on_behalf_sessions = []  # e.g. ["nori-5aac"]
claude_model           = ""
claude_effort          = "high"   # explicit default; "" keeps the Claude CLI default; low | medium | xhigh | max
codex_model            = ""
codex_reasoning_effort = ""   # low | medium | high
agy_model              = ""   # agy has no reasoning-effort knob
grok_model             = ""   # passed as `grok --model`
grok_effort            = ""   # low | medium | high
opencode_model         = ""   # provider/model, e.g. anthropic/claude-sonnet-4-5
opencode_effort        = ""   # passed as `opencode run --variant`
deepseek_model         = ""   # OpenCode provider/model id, e.g. fireworks-ai/accounts/fireworks/routers/deepseek-pro-latest
deepseek_effort        = ""   # same values as opencode_effort
muse_model             = ""   # passed as `muse exec --model`
muse_effort            = ""   # none | minimal | low | medium | high | xhigh | max | ultra

# Persona name -> ElevenLabs voice id. The full built-in roster (see
# config.DEFAULT_ROSTER) ALWAYS applies — this [roster] section MERGES over it,
# so you only list personas you want to add or whose voice you want to override.
# (You do NOT need to copy the built-ins here; an out-of-date copy used to
# silently hide newer personas, which merge semantics now prevent.)
# [roster]
# Mike   = "nPczCjzI2devNBz1zQrb"   # override a built-in persona's voice
# Custom = "yoZ06aMxZJJ28mfd3POQ"   # add a brand-new persona

# Optional: override the voice-picker catalogue surfaced in the agent
# settings UI. Default catalogue has ~30 entries; uncomment to replace.
# [[voice_catalog]]
# id    = "nPczCjzI2devNBz1zQrb"
# label = "Brian — warm male"

[audio]
# Audio delivery strategy.
#   "raw-pcm" (default)     — Cartesia WebSocket raw PCM over
#                              /clips/<id>/stream. Native iOS plays chunks
#                              directly through AVAudioEngine.
#   "chunked-file"          — /clips/<id>/stream (chunked
#                              Transfer-Encoding) + /audio/<file>.mp3
#                              fallback. Starts playback as soon as first
#                              TTS bytes arrive.
#   "hls"                    — ffmpeg-segmented playlist + AAC chunks.
#                              Conservative full-clip path; requires
#                              `ffmpeg` on PATH.
# Env override: CLAUDE_PWA_DELIVERY=raw-pcm|hls|chunked-file
# delivery = "raw-pcm"

# [apns]
# Push notifications: when an agent finishes its turn and is waiting on you,
# the server sends a "your turn" alert to registered iOS devices. Best-effort:
# a failed push never breaks a turn.
#
# Phones running a current Clarp app issue this Host a push grant when they
# pair; those phones get pushes through Clarp Audio Central with no key or
# account here. Other devices go one of two ways (see docs/push-relay.md):
#   relay  - through Clarp Audio Central, which holds the app's APNs key.
#            Used automatically when [audio_central] has a credential; this
#            Computer needs no .p8.
#   direct - signed here with your own .p8 (development). Create it in the
#            Apple developer portal under Keys (enable "Apple Push
#            Notifications service"). The .p8 is a secret — keep it out of
#            git, e.g. ~/.config/clarp/AuthKey_XXXX.p8.
# mode        = "auto"                # auto (relay if possible, else direct) | relay | direct | off
# background_sync = false             # silent sync push when a turn ends without an alert
# key_path    = "~/.config/clarp/AuthKey_XXXXXXXXXX.p8"   # direct only
# key_id      = "XXXXXXXXXX"          # direct only: the .p8 Key ID
# team_id     = "XXXXXXXXXX"          # direct only: Apple Developer Team ID
# bundle_id   = "com.maxteabag.clarp" # direct only: the app's bundle id (default shown)
# environment = "production"          # fallback for tokens registered without one:
#                                     # production (TestFlight/App Store) | sandbox
# # The .p8 path may also be supplied via the APNS_KEY_PATH env var.

# [fcm]
# Android push: the same alerts iPhones get, delivered to the Clarp Android
# app through Firebase Cloud Messaging (HTTP v1), signed here with a Google
# service account of the app's Firebase project (Firebase console > Project
# settings > Service accounts > Generate new private key). The JSON key is a
# secret — keep it out of git. The project id is read from the file. Without
# it, Android phones are not offered push (feature `push_fcm` is not
# advertised). See docs/push-android.md.
# service_account = "~/.config/clarp/fcm-service-account.json"
# # The path may also be supplied via the FCM_SERVICE_ACCOUNT env var.

# [audio_central]
# Clarp Audio Central: managed Clarp Voice and the APNs push relay. The
# credential is this Computer's cav1.… Computer credential, returned when the
# Computer is claimed with a claim code from the Clarp app. It is a secret;
# revoking the Computer in the app stops its voice and its pushes.
# url        = "https://clarp-audio-central.peter-w-adams96.workers.dev"  # default
# credential = "cav1.<account>.<key-id>.<secret>"

# [runtime]
# How a newly installed runtime release takes over. "natural" (default) never
# holds messages while anything is running: it waits for a moment with nothing
# to cut short and fences only for the seconds of the seal check. "fenced"
# holds new turns for up to 15 minutes per attempt, with backoff, until the
# runtime is idle. CLARP_RELEASE_DRAIN=natural outranks this. Read live; see
# docs/runtime-restarts.md "Graceful release drain".
# release_drain = "natural"

# [transcript_shadow]
# Shadow run of the incremental transcript import: computed beside the full
# import on a sample of ticks, compared, logged, never served. Off by default;
# CLARP_TRANSCRIPT_SHADOW=0 turns it off whatever this says. See
# docs/transcript-incremental-import.md.
# enabled = false
# sample_every = 20                 # at most one shadow run per N imports
# max_cpu_seconds_per_hour = 30.0
# max_load_per_cpu = 0.75           # skip when load1 / CPUs is above this
# max_io_pressure = 10.0            # skip when /proc/pressure/io some avg10 is above this
# max_memory_pressure = 10.0
# digest_every_tail = false        # true: read and digest every imported byte of a
#                                   # transcript at every tail import (as before schema
#                                   # 124). false: at the first tail after a Host start,
#                                   # at every audit, and when the file looks touched.
# audit_unchanged_by_digest = true  # an unchanged file whose audit is due (after a Host
#                                   # start) has its bytes read once and compared with the
#                                   # stored digest. false: it is imported in full.
# What a tail import may find changed among the database rows its frontier was
# published with (lib/message_carry.py gives each rule's reason). false: such a
# change is a full import, as before the rule existed.
# carry_session_rows = true         # message rows of the agent's other sessions
# carry_later_turns = true          # turn rows that began after the turns before the
#                                   # tail's boundary (two seconds of slack)
# carry_new_sends = true            # a new /send row whose words were not said before
# carry_live_rows = false           # true: a live row (the row a reply streams into) may be
#                                   # new, rewritten or gone, unless a reply before the
#                                   # tail's boundary carries its trace. Off by default.

[workspace]
resolver = "3"
members = [
    "crates/clarp-host",
    "crates/clarp-child",
    "crates/clarp-actor",
    "crates/clarp-backend",
    "crates/clarp-ports",
    "crates/clarp-protocol",
    "crates/clarp-shim",
    "crates/clarp-tool-args",
    "crates/clarp-spool",
    "crates/clarp-codec",
    "crates/clarp-kernel",
    "crates/clarp-kernel/provider-hook",
    "crates/clarp-store-mem",
    "crates/clarp-store-sqlite",
    "crates/clarp-store-files",
    "crates/clarp-speech",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false

[workspace.dependencies]
clarp-child = { path = "crates/clarp-child" }
clarp-ports = { path = "crates/clarp-ports" }
clarp-codec = { path = "crates/clarp-codec" }
clarp-store-mem = { path = "crates/clarp-store-mem" }
clarp-provider-hook = { path = "crates/clarp-kernel/provider-hook" }
clarp-kernel = { path = "crates/clarp-kernel" }
clarp-backend = { path = "crates/clarp-backend" }
clarp-actor = { path = "crates/clarp-actor" }
clarp-protocol = { path = "crates/clarp-protocol" }
clarp-tool-args = { path = "crates/clarp-tool-args" }
clarp-shim = { path = "crates/clarp-shim" }
clarp-store-sqlite = { path = "crates/clarp-store-sqlite" }
clarp-store-files = { path = "crates/clarp-store-files" }
clarp-speech = { path = "crates/clarp-speech" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "io-util"] }
# The owner's own file of settings is written in TOML, by hand and by other programs. It is
# read by a reader of TOML: a reader of lines would misread what it did not expect, and what
# is misread there is a key or a voice.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# The one thing the Host says to the outside: a push for a phone, handed to the relay over
# HTTPS. A small blocking client on a thread of its own; nothing else in the Host speaks TLS.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
clarp-spool = { path = "crates/clarp-spool" }
# The connection relay: the one outbound WebSocket a phone's requests come down, over TLS. It is
# the crate Axum takes for WebSockets (its `ws`), so that the Host has one of them, and its TLS
# is the rustls the push relay's client already brings.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# Whom the connector trusts to be the relay is said by the Host itself: the web's authorities,
# with the one provider of cryptography the Host has. Both are what the push client brings.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# The push service is spoken to over HTTP/2 and takes nothing else: a ring reaches a phone as
# an incoming call only by a push this Host hands to the service itself, since the relay
# carries none of that kind. The client of the hyper project, used as it is, over the TLS
# the Host already has; and the signing of a token of the Host's own with the key its owner
# gave it, by the provider of cryptography that TLS already brings.
h2 = "0.4"
http = "1"
url = "2"
bytes = "1"
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The Host's own router, asked from inside the Host: what came through the relay is served by
# the same routes as what came through the door, with no socket in between.
tower = { version = "0.5", default-features = false, features = ["util"] }
nix = { version = "0.29", features = ["signal", "process", "poll", "user"] }
# A terminal needs a pseudo-terminal: a child that has one for its own, and a size that can
# be set. Both are calls this workspace does not make itself (it forbids unsafe code); this
# crate makes them and gives the terminal as something to read and to write.
pty-process = { version = "0.5", features = ["async"] }
# A janitor's schedule is read in a time zone its owner chooses. Which local times a clock skips
# and which come twice is the zone's own, read from the machine's table of zones, the one the
# Python Host reads. Pinned to a release that had been in use for six weeks when it was taken:
# 1.0.0 came out on 15 Nov 2026, two days before. Only what reads that table: nothing bundled,
# and no asking the machine which zone it is in.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tzdb-zoneinfo"] }
regex = "1"
# A name a message spells out is found whatever way its letters are composed: the Python Host
# compares the two in the canonical form that takes a letter apart into its base and its marks.
unicode-normalization = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
# A turn's token is signed with a key of the Host's own (HMAC-SHA256), and checked in constant time.
hmac = "0.12"
# The fields of a JSON object stay in the order they were given: what an agent wrote and what
# a tool was called with are read in that order, as the Python Host reads them.
# float_roundtrip: a fraction is read as the number it is. Without it the reader may be one
# step off on a fraction of seventeen digits, and a number an agent published comes back as
# another (found by the form vectors: 9.999999900000001e-05 was read as 9.9999999e-05).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace]
resolver = "3"
members = [
    "crates/clarp-host",
    "crates/clarp-actor",
    "crates/clarp-backend",
    "crates/clarp-ports",
    "crates/clarp-protocol",
    "crates/clarp-shim",
    "crates/clarp-spool",
    "crates/clarp-codec",
    "crates/clarp-kernel",
    "crates/clarp-store-mem",
    "crates/clarp-store-sqlite",
    "crates/clarp-store-files",
    "crates/clarp-speech",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false

[workspace.dependencies]
clarp-ports = { path = "crates/clarp-ports" }
clarp-codec = { path = "crates/clarp-codec" }
clarp-store-mem = { path = "crates/clarp-store-mem" }
clarp-kernel = { path = "crates/clarp-kernel" }
clarp-backend = { path = "crates/clarp-backend" }
clarp-actor = { path = "crates/clarp-actor" }
clarp-protocol = { path = "crates/clarp-protocol" }
clarp-shim = { path = "crates/clarp-shim" }
clarp-store-sqlite = { path = "crates/clarp-store-sqlite" }
clarp-store-files = { path = "crates/clarp-store-files" }
clarp-speech = { path = "crates/clarp-speech" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# The owner's own file of settings is written in TOML, by hand and by other programs. It is
# read by a reader of TOML: a reader of lines would misread what it did not expect, and what
# is misread there is a key or a voice.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# The one thing the Host says to the outside: a push for a phone, handed to the relay over
# HTTPS. A small blocking client on a thread of its own; nothing else in the Host speaks TLS.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
clarp-spool = { path = "crates/clarp-spool" }
nix = { version = "0.29", features = ["signal", "process", "poll"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
# The fields of a JSON object stay in the order they were given: what an agent wrote and what
# a tool was called with are read in that order, as the Python Host reads them.
# float_roundtrip: a fraction is read as the number it is. Without it the reader may be one
# step off on a fraction of seventeen digits, and a number an agent published comes back as
# another (found by the form vectors: 9.999999900000001e-05 was read as 9.9999999e-05).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

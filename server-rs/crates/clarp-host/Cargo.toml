[package]
name = "clarp-host"
description = "The Clarp Host: one process that serves the apps and runs the agents"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clarp-child.workspace = true
axum = { workspace = true, features = ["matched-path"] }
bytes.workspace = true
clarp-actor.workspace = true
clarp-backend.workspace = true
clarp-codec.workspace = true
clarp-kernel.workspace = true
clarp-ports.workspace = true
clarp-protocol.workspace = true
clarp-shim.workspace = true
clarp-speech.workspace = true
clarp-spool.workspace = true
clarp-store-files.workspace = true
clarp-store-mem.workspace = true
clarp-store-sqlite.workspace = true
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
futures-util.workspace = true
h2.workspace = true
url.workspace = true
qrcode = { version = "=0.14.1", default-features = false }
http.workspace = true
jiff = { workspace = true, features = ["tz-system"] }
nix = { workspace = true, features = ["feature", "fs"] }
pty-process.workspace = true
regex.workspace = true
ring.workspace = true
rusqlite.workspace = true
# A lane that does not let go is signalled through a handle on its process (`pidfd`), which
# nix does not offer without unsafe code.
rustix = { version = "1.1", features = ["process", "fs"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
tower.workspace = true
ureq.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
clarp-sealed.workspace = true
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true

name: Native desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "contract/**"
      - ".github/workflows/desktop-native.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "contract/**"
      - ".github/workflows/desktop-native.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to rebuild and publish
        required: false
        type: string

permissions:
  contents: read

jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.11 and quality tools
        run: >-
          pacman -Syu --noconfirm
          appstream
          clang
          cmake
          ninja
          qt6-base
          qt6-declarative
          qt6-multimedia
          qt6-multimedia-ffmpeg
          qt6-svg
          qt6-wayland

      - name: Release build with warnings as errors
        working-directory: desktop
        run: |
          cmake --preset release
          cmake --build --preset release --parallel
          ctest --test-dir build/release --output-on-failure
          cmake --build --preset release --target all_qmllint
          appstreamcli validate --no-net packaging/linux/com.maxteabag.Clarp.metainfo.xml

      - name: Address and undefined behavior sanitizers
        working-directory: desktop
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset sanitizers
          cmake --build --preset sanitizers --parallel
          ctest --preset sanitizers

      - name: clang-tidy gate
        working-directory: desktop
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset analysis
          cmake --build --preset analysis --parallel 2
          ctest --test-dir build/analysis --output-on-failure

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: clarp-native-linux-unpackaged
          path: desktop/build/release/clarp-desktop
          if-no-files-found: error

  release-bundles:
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' ||
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.linux.result == 'success')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check out tagged release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          path: release-source

      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SOURCE: ${{ github.workspace }}/release-source
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          project_version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' "$RELEASE_SOURCE/pyproject.toml" | head -n 1)"
          test "$version" = "$project_version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            flatpak \
            flatpak-builder \
            libegl1 \
            libglx0 \
            libopengl0 \
            zsync

      - name: Build bundled AppImage
        env:
          CLARP_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          CLARP_SOURCE_ROOT: ${{ github.workspace }}/release-source
          CLARP_APPIMAGE_OUTPUT_DIR: ${{ github.workspace }}/dist
          CLARP_APPIMAGE_TOOL_DIR: ${{ runner.temp }}/clarp-appimage-tools
        run: desktop/packaging/appimage/build-in-flatpak.sh

      - name: Build sideloadable Flatpak
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flatpak-builder --user --force-clean \
            --repo="$GITHUB_WORKSPACE/dist/flatpak-repo" \
            release-source/desktop/build/flatpak-release \
            release-source/desktop/packaging/flatpak/com.maxteabag.Clarp.yml
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$GITHUB_WORKSPACE/dist/flatpak-repo" \
            "$GITHUB_WORKSPACE/dist/Clarp-$VERSION-x86_64.flatpak" \
            com.maxteabag.Clarp

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clarp-desktop-${{ steps.version.outputs.version }}-x86_64
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.AppImage.sha256
            dist/*.flatpak
          if-no-files-found: error

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          assets=(
            "dist/Clarp-$VERSION-x86_64.AppImage"
            "dist/Clarp-$VERSION-x86_64.AppImage.zsync"
            "dist/Clarp-$VERSION-x86_64.AppImage.sha256"
            "dist/Clarp-$VERSION-x86_64.flatpak"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "Clarp $RELEASE_TAG"
          fi

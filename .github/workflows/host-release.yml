name: Host startup benchmark build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arm: after
            commit: b9e6a804e38667b24312721e4eb4a12733bdb7ff
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
          shared-key: host-release-x86_64
      - name: Compile the exact Host and shim
        working-directory: server-rs
        env:
          BENCH_COMMIT: ${{ matrix.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$BENCH_COMMIT"
          rustc -Vv
          cargo build --release --locked -p clarp-host -p clarp-shim
      - name: Check opening live snapshot parity
        working-directory: server-rs
        run: |
          set -euo pipefail
          name=a_glance_shows_the_running_turn_and_the_conversation_as_committed_and_writes_nothing
          cargo test --release --locked -p clarp-actor --test actor "$name" -- --exact | tee "$RUNNER_TEMP/glance-parity.log"
          grep -F "test $name ... ok" "$RUNNER_TEMP/glance-parity.log"
      - name: Save exact binaries for the comparison
        env:
          BENCH_COMMIT: ${{ matrix.commit }}
        run: |
          mkdir dist
          cp server-rs/target/release/{clarp-host,clarp-shim} dist/
          printf '%s\n' "$BENCH_COMMIT" > dist/COMMIT
          rustc -Vv > dist/RUSTC
          (cd dist && sha256sum clarp-host clarp-shim > SHA256SUMS)
          tar -czf host.tar.gz -C dist clarp-host clarp-shim COMMIT RUSTC SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: clarp-host-rr935-${{ matrix.arm }}
          path: host.tar.gz
          retention-days: 3

name: Make GHCR public

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Set ghcr.io/maxteabag/clarp public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo '=== package before ==='
          gh api user/packages/container/clarp
          echo '=== PATCH visibility ==='
          gh api --method PATCH user/packages/container/clarp -f visibility=public
          echo patch_exit:$?
          echo '=== PUT visibility ==='
          gh api --method PUT user/packages/container/clarp -f visibility=public
          echo put_exit:$?
          echo '=== POST visibility ==='
          gh api --method POST user/packages/container/clarp -f visibility=public
          echo post_exit:$?
          echo '=== graphql ==='
          gh api graphql -f query='
            query {
              user(login:"Maxteabag") {
                packages(first:20, packageType:CONTAINER) {
                  nodes { id name visibility }
                }
              }
            }'
          echo graphql_exit:$?
          echo '=== package after ==='
          gh api user/packages/container/clarp

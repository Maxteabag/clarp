name: Desktop checks

# The Rust desktop's gate for work branches, so nothing compiles on the
# owner's machines: unit tests, the headless behaviour checks against the fake
# Host, and a release binary to run locally, all as artifacts; on macOS the
# unit tests, the --pair check and a zipped Clarp.app. Push a branch
# (not main) that touches desktop-rs, or run it by hand with a branch and a
# list of checks.

on:
  push:
    branches-ignore: [main]
    paths:
      - "desktop-rs/**"
      - "static/icon.png"
      - "src-tauri/icons/icon.icns"
      - ".github/workflows/desktop-checks.yml"
  workflow_dispatch:
    inputs:
      checks:
        description: "Space-separated check names (empty = the default set)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_CHECKS: >-
    scrollbar transcript scroll scroll-jump row-overlap composer live a2a receipts
    artifacts form-events artifact-keys link-hints keymap switcher panes sidebar banner
    layout-warning updates settings themes fonts startup refocus avatars message-search mention customize chat-zoom
    send desktop vim processes pair

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs
          shared-key: desktop-debug
      - name: Unit and contract tests
        working-directory: desktop-rs
        # pipefail: without it the job takes tee's exit code and a failing
        # test passes.
        run: |
          set -o pipefail
          cargo test --locked -p clarp-core -p clarp-engine -p clarp-net -p clarp-slint 2>&1 | tee /tmp/cargo-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-test-log
          path: /tmp/cargo-test.log

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build and check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libudev-dev \
            dbus gnome-keyring python3 fonts-jetbrains-mono fonts-noto-core fonts-dejavu-core fonts-liberation2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs
          shared-key: desktop-debug
      - name: Build the app
        working-directory: desktop-rs
        run: cargo build --locked -p clarp-slint
      - name: Headless checks
        working-directory: desktop-rs
        env:
          CHECKS: ${{ github.event.inputs.checks }}
        run: |
          set -u
          list="${CHECKS:-$DEFAULT_CHECKS}"
          mkdir -p /tmp/checks
          failed=""
          for c in $list; do
            echo "::group::check $c"
            if slint-app/tests/check.sh "$c" "/tmp/checks/$c" > "/tmp/checks/$c.log" 2>&1; then
              echo "$c: E2E_PASS"
            else
              # One rerun: some checks are load-sensitive; a second failure counts.
              if slint-app/tests/check.sh "$c" "/tmp/checks/$c-rerun" > "/tmp/checks/$c-rerun.log" 2>&1; then
                echo "$c: passed on rerun"
              else
                echo "$c: FAILED"; failed="$failed $c"
              fi
            fi
            grep -E "^FAIL" "/tmp/checks/$c.log" | head -20 || true
            echo "::endgroup::"
          done
          echo "failed:${failed:- none}" | tee /tmp/checks/summary.txt
          [ -z "$failed" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: /tmp/checks

  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs
      - name: Release build
        working-directory: desktop-rs
        run: cargo build --release --locked -p clarp-slint && strip -o /tmp/clarp-slint target/release/clarp-slint
      - uses: actions/upload-artifact@v4
        with:
          name: clarp-slint-x86_64-linux
          path: /tmp/clarp-slint

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs
          shared-key: desktop-macos-debug
      - name: A throwaway default keychain
        # The Keychain round trip and the pair check write here, not the
        # runner's login keychain.
        run: |
          security create-keychain -p probe clarp-test.keychain
          security list-keychains -d user -s clarp-test.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s clarp-test.keychain
          security unlock-keychain -p probe clarp-test.keychain
          security set-keychain-settings clarp-test.keychain
      - name: Unit and contract tests
        working-directory: desktop-rs
        env:
          CLARP_TEST_KEYCHAIN: "1"
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -p clarp-core -p clarp-engine -p clarp-net -p clarp-slint 2>&1 | tee /tmp/cargo-test-macos.log
      - name: Pair against the fake Host
        working-directory: desktop-rs
        env:
          CLARP_TEST_KEYCHAIN: "1"
        run: |
          cargo build --locked -p clarp-slint
          slint-app/tests/check.sh pair /tmp/checks-macos/pair
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-test-logs
          path: |
            /tmp/cargo-test-macos.log
            /tmp/checks-macos

  macos-app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs
          shared-key: desktop-macos-release
      - name: Release build
        working-directory: desktop-rs
        run: cargo build --release --locked --target aarch64-apple-darwin -p clarp-slint
      - name: Clarp.app
        run: |
          desktop-rs/tools/macos-bundle.sh desktop-rs/target/aarch64-apple-darwin/release/clarp-slint \
            "${GITHUB_SHA::12}" "/tmp/clarp-slint-${GITHUB_SHA}-aarch64-macos.zip"
          # What Jasper installs: it unzips to a launchable app.
          mkdir /tmp/unzipped && ditto -x -k "/tmp/clarp-slint-${GITHUB_SHA}-aarch64-macos.zip" /tmp/unzipped
          codesign --verify --strict /tmp/unzipped/Clarp.app
          /tmp/unzipped/Clarp.app/Contents/MacOS/clarp-slint --version
          /tmp/unzipped/Clarp.app/Contents/MacOS/clarp-slint --help | grep -- --pair
      - uses: actions/upload-artifact@v4
        with:
          name: clarp-slint-aarch64-macos
          path: /tmp/clarp-slint-${{ github.sha }}-aarch64-macos.zip

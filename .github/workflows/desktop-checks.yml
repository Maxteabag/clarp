name: Desktop checks (ROWS scratch proof)

# SCRATCH PROOF BRANCH proof/desktop-rows-20261101 ONLY, never merged.
# ONE dispatch-only job (no push/pull_request trigger): PR #231's send check
# row-height failure. r-walk = the PR #231 form (a tree walk per sample), with
# measurer reports and samples correlated; r-handle = C1 (a composer handle
# bound once, no walk); r-neg = C1 against a composer that really starts tall.
# Each arm's oracle stops the job on anything unexpected. Synthetic, public.
# Budget (whole job <= 30 min, every step capped): epoch 1, checkout 1,
# deps 2, toolchain 1, cache 1, build 10, 3 arms x 2, stage 1, upload 2 = 25,
# plus 5 unallocated. rows/admit.py admits each phase fail-closed with a 3 min
# reserve. The upload carries only /tmp/rows-upload, staged to <= 80 MB.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-rows-proof
  cancel-in-progress: false

jobs:
  rows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-rs
    steps:
      - name: Start epoch (the budget's zero)
        timeout-minutes: 1
        working-directory: /
        run: |
          mkdir -p /tmp/rows
          date +%s > /tmp/rows-epoch
          cp /tmp/rows-epoch /tmp/rows/epoch.txt
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Dependencies
        timeout-minutes: 2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libudev-dev \
            dbus gnome-keyring python3 fonts-jetbrains-mono fonts-noto-core fonts-dejavu-core fonts-liberation2
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 1
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 1
        with:
          workspaces: desktop-rs
          shared-key: desktop-debug
          save-if: false
      - name: Build once (the app)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 rows/admit.py build 10
          git rev-parse HEAD 'HEAD^{tree}' > /tmp/rows/source.txt
          cargo build --locked -p clarp-slint > /tmp/rows/build.log 2>&1
          sha256sum target/debug/clarp-slint >> /tmp/rows/source.txt
      - name: ROWS walk sampler, the PR #231 form (expect the row FAIL, correlated)
        timeout-minutes: 2
        run: |
          set -uo pipefail
          python3 rows/admit.py r-walk 2 || exit 7
          ulimit -f 40960
          # The runner's shell is `bash -e`: the expected non-zero (a RED) must not end the step
          # before its rc is recorded and the oracle judges it. Only this command runs without -e.
          set +e
          CLARP_ROWS_MEASURE=1 timeout 100 slint-app/tests/check.sh send /tmp/rows/r-walk > /tmp/rows/r-walk.log 2>&1
          rc=$?
          set -e
          echo "rc=$rc" > /tmp/rows/r-walk.rc
          python3 rows/oracle.py r-walk /tmp/rows
      - name: ROWS C1 handle sampler (GREEN: every row, composer and timing check)
        timeout-minutes: 2
        run: |
          set -uo pipefail
          python3 rows/admit.py r-handle 2 || exit 7
          ulimit -f 40960
          # The runner's shell is `bash -e`: the expected non-zero (a RED) must not end the step
          # before its rc is recorded and the oracle judges it. Only this command runs without -e.
          set +e
          CLARP_ROWS_MEASURE=1 CLARP_ROWS_SAMPLER=handle timeout 100 slint-app/tests/check.sh send /tmp/rows/r-handle > /tmp/rows/r-handle.log 2>&1
          rc=$?
          set -e
          echo "rc=$rc" > /tmp/rows/r-handle.rc
          python3 rows/oracle.py r-handle /tmp/rows
      - name: ROWS C1 against a composer that really starts tall (must FAIL)
        timeout-minutes: 2
        run: |
          set -uo pipefail
          python3 rows/admit.py r-neg 2 || exit 7
          ulimit -f 40960
          # The runner's shell is `bash -e`: the expected non-zero (a RED) must not end the step
          # before its rc is recorded and the oracle judges it. Only this command runs without -e.
          set +e
          CLARP_ROWS_MEASURE=1 CLARP_ROWS_SAMPLER=handle CLARP_ROWS_FORCE_TALL=1 timeout 100 slint-app/tests/check.sh send /tmp/rows/r-neg > /tmp/rows/r-neg.log 2>&1
          rc=$?
          set -e
          echo "rc=$rc" > /tmp/rows/r-neg.rc
          python3 rows/oracle.py r-neg /tmp/rows
      - name: Stage the upload (<= 80 MB, whole files only)
        if: always()
        timeout-minutes: 1
        run: |
          set -uo pipefail
          # Every raw file is hashed; allowlisted ones are copied whole while
          # they fit; anything left out is listed (size, sha256) in
          # OVERFLOW.json, stays on the runner, and makes the proof INCOMPLETE
          # (this step and the job fail). Nothing is ever cut.
          python3 rows/stage.py /tmp/rows /tmp/rows-upload
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 2
        with:
          name: rows
          path: /tmp/rows-upload
          retention-days: 7
          if-no-files-found: error

name: Desktop checks (FAFB scratch proof)

# SCRATCH PROOF BRANCH proof/desktop-fafb-20261101 ONLY, never merged.
# Replaces this branch's copy of the desktop checks with ONE dispatch-only job:
# no push or pull_request trigger, so pushing the branch starts nothing.
# F-A: host_flow's /select read against a causally held record (RED, GREEN,
# two negatives). F-B: the send check's first drawn fade frame, bridge against
# drawn box (observe + RED), then B2 (GREEN only if M) and B2 against a box
# that really starts tall (must FAIL). Each step's oracle stops the job on
# anything unexpected. Artifacts are synthetic (the fake Host) and public.
# Budget (whole job <= 30 min, every step capped): epoch 1, checkout 1,
# deps 2, toolchain 1, cache 1, build 10, F-A 2, F-B 3 x 2, stage 1, upload 2
# = 27, plus 3 unallocated for the runner's own set-up and post steps. Before
# each proof phase fafb/admit.py admits it only if elapsed + its cap + the
# 3 min finalization reserve fit (fail-closed, exit 7 = STOP). The upload
# carries only /tmp/fafb-upload, staged to <= 80 MB before it runs.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-fafb-proof
  cancel-in-progress: false

jobs:
  fafb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-rs
    steps:
      - name: Start epoch (the budget's zero)
        timeout-minutes: 1
        working-directory: /
        run: |
          mkdir -p /tmp/fafb
          date +%s > /tmp/fafb-epoch
          cp /tmp/fafb-epoch /tmp/fafb/epoch.txt
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Dependencies
        timeout-minutes: 2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libudev-dev \
            dbus gnome-keyring python3 fonts-jetbrains-mono fonts-noto-core fonts-dejavu-core fonts-liberation2
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 1
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 1
        with:
          workspaces: desktop-rs
          shared-key: desktop-debug
          save-if: false
      - name: Build once (the app and the host_flow test binary)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 fafb/admit.py build 10
          git rev-parse HEAD 'HEAD^{tree}' > /tmp/fafb/source.txt
          cargo build --locked -p clarp-slint > /tmp/fafb/build.log 2>&1
          cargo test --locked -p clarp-engine --test host_flow --no-run >> /tmp/fafb/build.log 2>&1
          sha256sum target/debug/clarp-slint >> /tmp/fafb/source.txt
      - name: F-A /select record ordering (RED, GREEN, 2 negatives)
        timeout-minutes: 2
        run: |
          set -uo pipefail
          python3 fafb/admit.py fa 2 || exit 7
          ulimit -f 20480
          # The runner's shell is `bash -e`: the expected non-zero (a RED) must not end the step
          # before its rc is recorded and the oracle judges it. Only this command runs without -e.
          set +e
          timeout 100 cargo test --locked -p clarp-engine --test host_flow fafb_ -- --test-threads=1 --nocapture > /tmp/fafb/fa.log 2>&1
          rc=$?
          set -e
          echo "rc=$rc" > /tmp/fafb/fa.rc
          python3 fafb/oracle.py fa /tmp/fafb
      - name: F-B observe the first drawn fade frame (current measurement, RED)
        timeout-minutes: 2
        run: |
          set -uo pipefail
          python3 fafb/admit.py b-obs 2 || exit 7
          ulimit -f 40960
          # The runner's shell is `bash -e`: the expected non-zero (a RED) must not end the step
          # before its rc is recorded and the oracle judges it. Only this command runs without -e.
          set +e
          CLARP_FAFB_FRAME=1 timeout 100 slint-app/tests/check.sh send /tmp/fafb/b-obs > /tmp/fafb/b-obs.log 2>&1
          rc=$?
          set -e
          echo "rc=$rc" > /tmp/fafb/b-obs.rc
          python3 fafb/oracle.py b-obs /tmp/fafb
      - name: F-B with B2 (GREEN only if M)
        timeout-minutes: 2
        run: |
          set -uo pipefail
          python3 fafb/admit.py b-green 2 || exit 7
          ulimit -f 40960
          # The runner's shell is `bash -e`: the expected non-zero (a RED) must not end the step
          # before its rc is recorded and the oracle judges it. Only this command runs without -e.
          set +e
          CLARP_FAFB_FRAME=1 CLARP_FAFB_DRAWN=1 timeout 100 slint-app/tests/check.sh send /tmp/fafb/b-green > /tmp/fafb/b-green.log 2>&1
          rc=$?
          set -e
          echo "rc=$rc" > /tmp/fafb/b-green.rc
          python3 fafb/oracle.py b-green /tmp/fafb
      - name: F-B with B2 against a box that really starts tall (must FAIL)
        timeout-minutes: 2
        run: |
          set -uo pipefail
          python3 fafb/admit.py b-neg 2 || exit 7
          ulimit -f 40960
          # The runner's shell is `bash -e`: the expected non-zero (a RED) must not end the step
          # before its rc is recorded and the oracle judges it. Only this command runs without -e.
          set +e
          CLARP_FAFB_FRAME=1 CLARP_FAFB_DRAWN=1 CLARP_FAFB_FORCE_TALL=1 timeout 100 slint-app/tests/check.sh send /tmp/fafb/b-neg > /tmp/fafb/b-neg.log 2>&1
          rc=$?
          set -e
          echo "rc=$rc" > /tmp/fafb/b-neg.rc
          python3 fafb/oracle.py b-neg /tmp/fafb
      - name: Stage the upload (<= 80 MB, whole files only)
        if: always()
        timeout-minutes: 1
        run: |
          set -uo pipefail
          # Every raw file is hashed; allowlisted ones are copied whole while
          # they fit; anything left out is listed (size, sha256) in
          # OVERFLOW.json, stays on the runner, and makes the proof INCOMPLETE
          # (this step and the job fail). Nothing is ever cut.
          python3 fafb/stage.py /tmp/fafb /tmp/fafb-upload
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 2
        with:
          name: fafb
          path: /tmp/fafb-upload
          retention-days: 7
          if-no-files-found: error

name: Conformance (Rust Host)

# The Rust Host against the Python Host on what a client can see (server-rs/conformance):
# the Python Host's answers are written down, planted changes must show against them, and the
# Rust Host is compared with them. It starts Python test Hosts, so it runs contained like
# replay.yml (no network, no credentials), and only when someone starts it:
#   gh workflow run conformance.yml -R Maxteabag/clarp --ref <branch>
# The job is red while the Rust Host differs; the report and the written-down answers are in
# the `conformance-report` artifact either way.
# The whole corpus is the gate a candidate lands by. A run of some scenarios only
# (`-f scenarios=a,b`) is a question, asked before the Rust Host is written: what the Python
# Host answers there. It gates nothing.
# The gate is every job of a run of the whole corpus: `conformance` writes down what the Python
# Host answers and compares the Rust Host with it, and each `proof` plants one change in the
# Python Host and requires the corpus to show it. A planted change runs the whole corpus once,
# so the eight of them were three quarters of a run of 28 minutes; side by side the gate takes
# about ten, which is what lets a candidate land on a main that moves twice an hour.

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "A comma-separated subset of the corpus. Empty: all of it, which is the gate."
        required: false
        default: ""

permissions:
  contents: read

# A newer run of the same question on the same branch takes the older one's place. A question
# about some scenarios never ends the run of the whole corpus beside it.
concurrency:
  group: conformance-${{ github.ref }}-${{ inputs.scenarios }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # The job token must not sit in .git/config where a test Host could read it.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
      - name: Build the Rust Host
        working-directory: server-rs
        run: cargo build --locked -p clarp-host -p clarp-shim
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Conformance
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          set -o pipefail
          mkdir -p conformance-report
          # The whole corpus: the planted changes are tried in the jobs beside this one, and
          # this one refuses when their number is not the suite's.
          if [ -n "$SCENARIOS" ]; then part=(--scenarios "$SCENARIOS"); else part=(--plants-beside 8); fi
          bash scripts/ci_contained.sh .venv/bin/python server-rs/conformance/conform.py cross \
            --build . --rust server-rs/target/debug/clarp-host --out conformance-report \
            "${part[@]}" \
            | tee conformance-report/console.txt
      # The report prints structure, counts and codes; the corpus is synthetic.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: conformance-report/

  # One planted change each: the Python Host's answers are written down once, the change is
  # planted in a copy of it, and the corpus has to show it. A scenario the reference did not
  # run to its end in is set aside and said (three at most). No Rust is built here. As many as
  # the suite has planted changes (`contract_plants.py`); `conformance` refuses another number.
  proof:
    if: ${{ inputs.scenarios == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plant: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: A planted change has to show
        run: |
          set -o pipefail
          mkdir -p conformance-proof
          # What a test Host left of a scenario it did not run to its end is kept beside the
          # console (`unfinished/`): its log and what its stand-in tool did.
          bash scripts/ci_contained.sh .venv/bin/python server-rs/conformance/conform.py plants \
            --build . --fresh --plant ${{ matrix.plant }} --out conformance-proof \
            | tee conformance-proof/console.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-proof-${{ matrix.plant }}
          path: conformance-proof/

name: Tests

# A pull request runs the critical gate (tests/critical.txt); a dispatch, the nightly
# schedule and a calling workflow (Docker) run the full suite.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  workflow_call:
    inputs:
      suite:
        type: string
        default: full

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUITE: ${{ (github.event_name == 'pull_request' && inputs.suite != 'full') && 'critical' || 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The job token must not sit in .git/config where a test could read it.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Native audio test dependency
        timeout-minutes: 12
        run: bash .github/scripts/install-test-ffmpeg.sh
      - run: uv sync --frozen --group dev
      - name: Prepare JavaScript dependencies and the web bundle (with network, before the contained tests)
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      # The contained steps have no network, so everything they need must exist now: a test that
      # finds the bundle missing would run an offline npm ci, which deletes node_modules first.
      - name: Assert the prepared dependencies exist
        run: test -f static/app/bundle.js && test -x node_modules/.bin/vitest
      # Everything the tests need is installed above, with the network. The tests themselves run with
      # no network (loopback only), no credentials, no privilege, an empty HOME and only their own
      # processes (scripts/ci_contained.sh, which self-checks that before the command starts).
      - name: Critical gate
        if: env.SUITE == 'critical'
        run: bash scripts/ci_contained.sh .venv/bin/python -m pytest -n0 $(sed -e 's/#.*//' tests/critical.txt) --junitxml=test-results/python.xml
      - name: Python unit, integration and contract tests
        if: env.SUITE == 'full'
        # Per-test phase timings stream into test-results/timing/ (flushed per line), so the
        # always() upload below keeps them even when the job is cancelled at its time limit.
        run: bash scripts/ci_contained.sh .venv/bin/python -m pytest -n 2 --junitxml=test-results/python.xml --clarp-timing-dir=test-results/timing
      - name: JavaScript behavior and contract tests
        if: ${{ !cancelled() }}
        run: bash scripts/ci_contained.sh npm test -- --reporter=default --reporter=junit --outputFile=test-results/javascript.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

name: Tests

# Only the critical gate (tests/critical.txt, a few minutes) ever runs by itself: on a
# pull request, and when the Docker workflow calls this one (every push to main). The
# full suite never starts automatically (owner's rule: no 15-minute runs, no nightly);
# someone starts it by hand with "Run workflow" when they want it. With "paths" filled
# in, that manual run executes only those test files (a fix's own tests on a candidate
# branch) instead of the full suite.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      paths:
        description: "Test files or node ids under tests/, space separated. Empty = full suite."
        type: string
        default: ""
  workflow_call:
    inputs:
      suite:
        type: string
        default: critical

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUITE: ${{ (github.event_name == 'workflow_dispatch' && inputs.paths != '') && 'paths' || ((github.event_name == 'workflow_dispatch' || inputs.suite == 'full') && 'full' || 'critical') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The job token must not sit in .git/config where a test could read it.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Native audio test dependency
        timeout-minutes: 12
        run: bash .github/scripts/install-test-ffmpeg.sh
      - run: uv sync --frozen --group dev
      - name: Prepare JavaScript dependencies and the web bundle (with network, before the contained tests)
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      # The contained steps have no network, so everything they need must exist now: a test that
      # finds the bundle missing would run an offline npm ci, which deletes node_modules first.
      - name: Assert the prepared dependencies exist
        run: test -f static/app/bundle.js && test -x node_modules/.bin/vitest
      # Everything the tests need is installed above, with the network. The tests themselves run with
      # no network (loopback only), no credentials, no privilege, an empty HOME and only their own
      # processes (scripts/ci_contained.sh, which self-checks that before the command starts).
      - name: Critical gate
        if: env.SUITE == 'critical'
        run: bash scripts/ci_contained.sh .venv/bin/python -m pytest -n0 $(sed -e 's/#.*//' tests/critical.txt) --junitxml=test-results/python.xml
      - name: Selected test files
        if: env.SUITE == 'paths'
        env:
          TEST_PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          set -f   # no globbing: node ids contain [ ]
          files=()
          # Only paths or node ids under tests/: nothing that could become a pytest option or leave the tree.
          allowed='^tests/[][A-Za-z0-9_./:-]+$'
          for p in $TEST_PATHS; do
            if [[ ! "$p" =~ $allowed || "$p" == *..* ]]; then echo "refusing path: $p"; exit 2; fi
            files+=("$p")
          done
          if [ ${#files[@]} -eq 0 ]; then echo "no test paths given"; exit 2; fi
          bash scripts/ci_contained.sh .venv/bin/python -m pytest -n0 "${files[@]}" --junitxml=test-results/python.xml
      - name: Python unit, integration and contract tests
        if: env.SUITE == 'full'
        # Per-test phase timings stream into test-results/timing/ (flushed per line), so the
        # always() upload below keeps them even when the job is cancelled at its time limit.
        run: bash scripts/ci_contained.sh .venv/bin/python -m pytest -n 2 --junitxml=test-results/python.xml --clarp-timing-dir=test-results/timing
      - name: JavaScript behavior and contract tests
        if: ${{ !cancelled() && env.SUITE != 'paths' }}
        run: bash scripts/ci_contained.sh npm test -- --reporter=default --reporter=junit --outputFile=test-results/javascript.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

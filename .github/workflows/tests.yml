name: Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen --group dev
      - run: npm ci --no-audit --no-fund
      - name: Python unit, integration and contract tests
        run: uv run --frozen --group dev python -m pytest -n 2 --junitxml=test-results/python.xml
      - name: JavaScript behavior and contract tests
        if: ${{ !cancelled() }}
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/javascript.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test_docker_node.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser suite against the built image
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          CLARP_E2E_SKIP_BUILD=1 scripts/test_e2e_docker.sh
      - name: Scan fixable CRITICAL vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --scanners vuln \
            --ignore-unfixed \
            --skip-version-check \
            --exit-code 1 \
            --severity CRITICAL \
            clarp:test

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/clarp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=stable,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            CLARP_VERSION=${{ github.ref_name }}
            CLARP_UPDATE_REMOTE=${{ github.server_url }}/${{ github.repository }}.git

# Change the name to one of your own: the relay is served at
# https://<name>.<your-account-subdomain>.workers.dev
name = "clarp-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "HOST_RELAY"
class_name = "HostRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostRelay"]

# RELAY_SECRET is set with `wrangler secret put RELAY_SECRET`; per-host keys are HMAC(secret, host_id).
# Never put the secret, or a Host's key, in this file.

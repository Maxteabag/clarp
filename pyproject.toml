[project]
name = "clarp-server"
version = "0.6.0"
description = "Private agent-control server for the Clarp PWA and native app"
requires-python = ">=3.12,<3.15"
license = "LicenseRef-PolyForm-Shield-1.0.0"
dependencies = [
  "av>=16.0",
  "faster-whisper>=1.0; sys_platform == 'linux'",
  "httpx[http2]>=0.27",
  "inotify-simple>=1.3; sys_platform == 'linux'",
  "PyJWT[crypto]>=2.8",
  "qrcode>=8.2",
  "textual>=8.2.8,<9",
  "websocket-client>=1.8",
  "zeroconf>=0.150.4,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Every test is isolated (temp DB, config, cache, random ports), so the suite
# runs across all cores. The timeout turns a deadlock into a failure with a
# stack trace instead of a run that never ends.
addopts = "-q -n auto --timeout=60"
markers = ["timeout: pytest-timeout per-test override"]

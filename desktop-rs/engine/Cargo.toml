[package]
name = "clarp-engine"
version = "0.1.0"
edition = "2024"
description = "The Clarp desktop's behaviour as plain Rust: Host connection, roster, conversations and commands, for any UI toolkit"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clarp-core = { path = "../core" }
clarp-net = { path = "../net" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
serde_json = "1"

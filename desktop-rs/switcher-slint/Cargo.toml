[package]
name = "clarp-switcher-slint"
version = "0.1.0"
edition = "2024"
description = "Experiment: the Clarp quick switcher in Slint (Rust-native UI, no Qt)"

[dependencies]
clarp-core = { path = "../core" }
clarp-net = { path = "../net" }
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
slint = { version = "1.18", default-features = false, features = [
    "std", "compat-1-2", "accessibility",
    "backend-winit",
    "renderer-software", "software-renderer-systemfonts",
] }

[target.'cfg(target_os = "linux")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit-wayland", "backend-winit-x11"] }

[build-dependencies]
slint-build = "1.18"

[package]
name = "clarp-net"
version = "0.1.0"
edition = "2024"
description = "Qt-free HTTP and SSE clients for the Clarp Rust desktop client"

[dependencies]
clarp-core = { path = "../core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
url = "2"
# The interface list (`device`): whether this device has a network, and Tailscale.
libc = "0.2"
# An agent's terminal on its Host (`terminal`): WebSocket frames over the
# same rustls (ring) and web roots as the HTTP client. The upgrade request is
# written by hand so a refusal's whole body is read.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# The Secret Service holds device tokens on Linux; macOS uses the Keychain.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }

[package]
name = "clarp-net"
version = "0.1.0"
edition = "2024"
description = "Qt-free HTTP and SSE clients for the Clarp Rust desktop client"

[dependencies]
clarp-core = { path = "../core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
url = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }

[package]
name = "clarp-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
clarp-core = { path = "../core" }
clarp-net = { path = "../net" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde_json = "1"
base64 = "0.22"
cxx = "1.0.202"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = "0.10.0"
qt-build-utils = { version = "0.10.0", default-features = false }
